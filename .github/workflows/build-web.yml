          fi
          exit 0

      - name: Cek hasil build
        if: env.BUILD_OK != '1'
        run: |
          echo "::error::Build gagal. Versi Flutter yang dicoba: 3.38.x, 3.35.x, 3.32.x, 3.29.x, terbaru"
          for f in /tmp/build-*.log; do
            echo "=== $f ==="
            grep -iE 'error|failed|went wrong|minimum|cannot be smaller' "$f" | tail -30 || true
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: ${{ env.PROJECT_ROOT }}/build/web
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
