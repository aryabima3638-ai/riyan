      - name: Build dengan Flutter terbaru (terakhir)
        if: env.BUILD_DONE != '1' && env.PREFER_LATEST != '1'
        run: |
          cd "$PROJECT_ROOT"
          set +e
          rm -rf .dart_tool build
          flutter --version
          LOG=/tmp/build-z.log
          flutter pub get 2>&1 | tee $LOG
          RC=${PIPESTATUS[0]}
          if [ "$RC" -eq 0 ]; then
            for n in 1 2 3 4 5; do
              flutter build web --release 2>&1 | tee $LOG
              RC=${PIPESTATUS[0]}
              [ "$RC" -eq 0 ] && break
            done
          fi
          if [ "$RC" -eq 0 ]; then
