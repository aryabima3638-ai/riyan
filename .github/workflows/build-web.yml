              flutter build web --release 2>&1 | tee $LOG
              RC=${PIPESTATUS[0]}
              [ "$RC" -eq 0 ] && break
            done
          fi
          if [ "$RC" -eq 0 ]; then
            echo "BUILD_DONE=1" >> "$GITHUB_ENV"
            echo "BUILD_OK=1" >> "$GITHUB_ENV"
            echo "::notice::Build sukses dengan Flutter 3.35.x"
          elif ! grep -Eiq 'minimum supported version|No named parameter|isn.t defined|is not defined|Undefined (name|class|method)|The (getter|method|named parameter)|Dart SDK|SDK version|version solving|requires Flutter|Unsupported (class file|Gradle|Kotlin)|Android Gradle Plugin|incompatible|Kotlin.*version|NoSuchMethod|compileSdk' $LOG; then
            echo "BUILD_DONE=1" >> "$GITHUB_ENV"
            echo "Error bukan masalah versi Flutter, tidak mencoba versi lain."
          else
            echo "::warning::Gagal di Flutter 3.35.x, mencoba versi lain..."
          fi
          exit 0

      - name: Setup Flutter 3.32.x
