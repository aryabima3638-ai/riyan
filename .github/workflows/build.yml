      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type }}
          path: ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
